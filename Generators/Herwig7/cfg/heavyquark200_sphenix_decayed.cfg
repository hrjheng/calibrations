# Identical to heavyquark200_sphenix.cfg except for the decay setting: no MaxLifeTime
# cut, so Herwig decays every particle type not flagged Stable in its defaults.
process        = heavyquark
energy         = 200
tune           = nashville
stable_strange = 0
mhatmin        = 4
# minkt = 0.1 GeV, not PYTHIA's pTHatMin = 0: the bottom matrix element at pT = 0
# triggers a Herwig 7.3.0 shower assertion (OneOneOneSplitFn.cc:70, z in (0,1))
minkt          = 0.1
