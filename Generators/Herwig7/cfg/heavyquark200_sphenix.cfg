# Heavy-quark 200 GeV following the sPHENIX MDC2 PYTHIA D0 configuration
# ($CALIBRATIONROOT/Generators/HeavyFlavor_TG/phpythia8_d02kpi_MDC2.cfg):
#   HardQCD:hardccbar + hardbbbar = on -> gg/qqbar -> c cbar and b bbar (MEHeavyQuark)
#   SoftQCD:inelastic = off
#   PhaseSpace:mHatMin = 4 GeV, pTHatMin = 0 (PYTHIA 8.312 defaults); see minkt below
#   ParticleDecays:tau0Max = 1e-7  -> generator decays only c*tau < 0.1 nm,
#                                     Geant4 decays everything longer-lived
process        = heavyquark
energy         = 200
tune           = nashville
stable_strange = 0
mhatmin        = 4
# minkt = 0.1 GeV, not PYTHIA's pTHatMin = 0: the bottom matrix element at pT = 0
# triggers a Herwig 7.3.0 shower assertion (OneOneOneSplitFn.cc:70, z in (0,1))
minkt          = 0.1
max_lifetime   = 0.0000001
